<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#fff1f7">

    <title>🎀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>

        <div class="sparkles">
            <span>✦</span>
            <span>♡</span>
            <span>✧</span>
            <span>♡</span>
            <span>✦</span>
            <span>✧</span>
        </div>
    </div>


    <!-- პატარა პროგრესის ხაზი -->
    <div class="progress">
        <div class="progress-fill"></div>
    </div>


    <main>

        <!-- =========================================
             დასაწყისი
        ========================================== -->

        <section class="intro">

            <div class="intro-content">

                <div class="bow bow-top">🎀</div>

                <div class="little-text">
                    MADE WITH LOVE(MAROEBI)
                </div>

                <h1>
                    ეს ადამიანი<br>
                    იძახის
                </h1>

                <div class="quote">
                    „არ ვარ ფოტოგენური“
                </div>

                <div class="cute-line">
                    ♡ ♡ ♡
                </div>

                <div class="scroll-hint">
                    შე გეი<br>
                    ასქროლეეეე
                    <span>↓</span>
                </div>

            </div>

        </section>


        <!-- =========================================
             ფოტოები
        ========================================== -->

        <section class="gallery">

            <div class="gallery-sticky">

                <div class="gallery-top">

                    <span>🎀</span>

                    <div class="top-line"></div>

                    <span id="counter">
                        1 / 7
                    </span>

                </div>


                <div class="decor decor-one">
                    ♡
                </div>

                <div class="decor decor-two">
                    ✦
                </div>

                <div class="decor decor-three">
                    🎀
                </div>


                <div
                    class="cards"
                    id="cards"
                ></div>


                <div
                    class="photo-caption"
                    id="caption"
                >
                    აი ახლა მითხარი რომ ფოტოგენური არ ხარ ♡
                </div>


                <div class="bottom-bow">
                    🎀
                </div>

            </div>

        </section>


        <!-- =========================================
             დასასრული
        ========================================== -->

        <section class="ending">

            <div class="ending-content">

                <div class="ending-bow">
                    🎀
                </div>

                <div class="ending-small">
                    კარგი, დავასრულოთ კამათი...
                </div>

                <h2>
                    ფოტოგენური ხარ
                </h2>

                <p>
                    ძალიანაც. ♡
                </p>

                <div class="hearts">
                    ♡　♡　♡
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
